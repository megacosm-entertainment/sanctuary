# The gateway and the stub realm as separate containers, talking over the
# realm protocol with mTLS: the reference small deployment. See
# deploy/README.md.
#
#   scripts/compose.sh               local identities (.dev/keys)
#   scripts/compose.sh -doppler stg  settings and identities from Doppler
#
# Each service reads two env files: deploy/<service>.env (the same in every
# environment, in git) and .dev/env/<service>.env (identities, pins and
# anything else that differs; never in git). The second is written by
# scripts/devkeys.sh, or served by `doppler run --mount` for the life of
# the compose command, leaving nothing on disk.

name: sanctuary

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "65532:65532"
  restart: unless-stopped

services:
  gateway:
    <<: *hardening
    build: { context: ., dockerfile: docker/runtime/Dockerfile }
    image: sanctuary-runtime:dev
    command: ["/sanctuary-gateway"]
    env_file:
      - path: deploy/gateway.env
      - path: ${SANCTUARY_ENV_DIR:-.dev/env}/gateway.env
        required: true
    # Host ports are PUBLISH_TELNET, PUBLISH_TELNETS and PUBLISH_WS (default
    # 9000/9010/9020), so staging can run beside a devcontainer that already
    # forwards those. scripts/compose.sh -doppler reads them from Doppler.
    ports:
      - "${PUBLISH_TELNET:-9000}:9000"
      - "${PUBLISH_TELNETS:-9010}:9010"
      - "${PUBLISH_WS:-9020}:9020"
    # The realm port (9030) is deliberately not published.

  realm-stub:
    <<: *hardening
    build: { context: ., dockerfile: docker/runtime/Dockerfile }
    image: sanctuary-runtime:dev
    command: ["/sanctuary-realm"]
    env_file:
      - path: deploy/realm-stub.env
      - path: ${SANCTUARY_ENV_DIR:-.dev/env}/realm-stub.env
        required: true
    depends_on: [gateway]
