<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanctuary gateway test client</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #15181b; --muted: #5b6168; --rule: #c9ccc9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #e5e7e4; --muted: #9aa0a6; --rule: #30353b; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-monospace, Menlo, monospace; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p.note { color: var(--muted); margin: 0 0 12px; max-width: 70ch; }
  #out { white-space: pre-wrap; border: 1px solid var(--rule); padding: 10px; height: 55vh; overflow-y: auto; }
  form { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  input[type=text], input[type=password] { flex: 1; min-width: 12ch; font: inherit; padding: 6px; }
  button, select { font: inherit; padding: 6px 10px; }
  #status { color: var(--muted); }
</style>
</head>
<body>
<h1>Sanctuary gateway: WebSocket test client</h1>
<p class="note">A plain browser WebSocket client for stage 01. It speaks <code>gmcp.mudstandards.org</code>: text in binary frames, GMCP in text frames. ANSI codes are stripped for display. It sends GMCP <code>Core.Hello</code> on connect.</p>
<form id="connect">
  <label for="proto">Subprotocol</label>
  <select id="proto"><option>gmcp.mudstandards.org</option></select>
  <button id="go" type="submit">Connect</button>
  <span id="status" role="status">Disconnected</span>
</form>
<div id="out" role="log" aria-live="polite" aria-label="Game output"></div>
<form id="send">
  <input id="line" type="text" autocomplete="off" aria-label="Command">
  <button type="submit">Send</button>
  <button type="button" id="hello">Resend GMCP Core.Hello</button>
  <button type="button" id="bad">Send malformed GMCP</button>
</form>
<script src="app.js"></script>
</body>
</html>
